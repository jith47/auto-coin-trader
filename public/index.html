<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGE Scalper Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e17;
            --surface: #111827;
            --surface2: #1e293b;
            --border: #1e293b;
            --text: #e2e8f0;
            --dim: #64748b;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --amber: #f59e0b;
            --purple: #a855f7;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        h1 span {
            color: var(--amber);
        }

        /* Login Screen */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 8px;
            font-size: 1.25rem;
        }

        .login-box p {
            color: var(--dim);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
        }

        .login-input:focus {
            border-color: var(--blue);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--blue);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .login-error {
            color: var(--red);
            font-size: 0.8rem;
            margin-top: 12px;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-green {
            background: rgba(34, 197, 94, .15);
            color: var(--green);
        }

        .badge-red {
            background: rgba(239, 68, 68, .15);
            color: var(--red);
        }

        .badge-amber {
            background: rgba(245, 158, 11, .15);
            color: var(--amber);
        }

        .badge-blue {
            background: rgba(59, 130, 246, .15);
            color: var(--blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-label {
            font-size: 0.75rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--dim);
            margin-top: 4px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            padding: 10px 16px;
            color: var(--dim);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: var(--surface2);
        }

        .text-green {
            color: var(--green);
        }

        .text-red {
            color: var(--red);
        }

        .text-dim {
            color: var(--dim);
        }

        .text-amber {
            color: var(--amber);
        }

        .text-blue {
            color: var(--blue);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all .15s;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .btn-danger {
            background: transparent;
            border-color: var(--red);
            color: var(--red);
            font-size: 0.75rem;
        }

        .delta-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px 20px;
        }

        .delta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .delta-label {
            font-size: 0.75rem;
            color: var(--dim);
        }

        .delta-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .active-trade {
            background: linear-gradient(135deg, rgba(59, 130, 246, .08), rgba(168, 85, 247, .08));
            border-color: var(--blue);
        }

        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding: 16px 20px;
        }

        .ind-item {
            font-size: 0.8rem;
        }

        .ind-label {
            color: var(--dim);
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .refresh-timer {
            font-size: 0.75rem;
            color: var(--dim);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .reason-cell {
            max-width: 250px;
            min-width: 180px;
        }

        .reason-content {
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .reason-content.collapsed {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .reason-content.expanded {
            white-space: pre-wrap;
            max-width: none;
            color: var(--text);
            padding: 8px 0;
        }

        .reason-more {
            color: var(--blue);
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 4px;
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div class="login-overlay" id="loginScreen">
        <div class="login-box">
            <h2>Mock Scalper</h2>
            <p>Enter your dashboard password</p>
            <input type="password" class="login-input" id="passwordInput" placeholder="Password" autofocus>
            <button class="login-btn" onclick="doLogin()">Login</button>
            <div class="login-error" id="loginError">Incorrect password</div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="container">
            <div class="header">
                <h1>Mock <span>Scalper</span></h1>
                <div class="header-right">
                    <span class="refresh-timer" id="timer">Auto-refresh: 10s</span>
                    <span class="live-dot" id="liveDot"></span>
                    <button class="btn btn-primary" onclick="triggerRun()">▶ Run Now</button>
                    <button class="btn" onclick="refresh()">↻ Refresh</button>
                    <button class="btn btn-danger" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="grid" id="statsGrid">
                <div class="card">
                    <div class="card-label">Status</div>
                    <div class="card-value" id="status">—</div>
                    <div class="card-sub" id="statusSub"></div>
                </div>
                <div class="card">
                    <div class="card-label">Today</div>
                    <div class="card-value" id="todayTrades">—</div>
                    <div class="card-sub" id="todayLosses"></div>
                </div>
                <div class="card">
                    <div class="card-label">Win Rate</div>
                    <div class="card-value" id="winRate">—</div>
                    <div class="card-sub" id="totalTrades"></div>
                </div>
                <div class="card">
                    <div class="card-label">Total P&L</div>
                    <div class="card-value" id="totalPnl">—</div>
                    <div class="card-sub" id="mockBalance"></div>
                </div>
            </div>

            <div class="panel active-trade" id="activePanel" style="display:none;">
                <div class="panel-header">
                    <span class="panel-title">🔴 Active Trade</span>
                    <span class="badge badge-blue" id="activeDirection">—</span>
                </div>
                <div class="indicator-grid" id="activeDetails"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">📊 Trade Log</span>
                    <span class="text-dim" id="tradeCount">0 trades</span>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Side</th>
                                <th>Entry</th>
                                <th>SL</th>
                                <th>TP</th>
                                <th>Qty</th>
                                <th>Score</th>
                                <th>Status</th>
                                <th>P&L</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody id="tradeBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header"><span class="panel-title">🔍 Last Run Result</span></div>
                <pre style="padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--dim);max-height:300px;overflow:auto;white-space:pre-wrap;"
                    id="lastRun">Click "Run Now" to trigger strategy evaluation</pre>
            </div>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'scalper_token';
        let refreshInterval;

        function getToken() { return localStorage.getItem(TOKEN_KEY); }

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
        }

        async function apiFetch(path) {
            const res = await fetch(path, { headers: authHeaders() });
            if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
            return res.json();
        }

        // Check if already logged in
        if (getToken()) { showDashboard(); }

        // Enter key on password input
        document.getElementById('passwordInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });

        async function doLogin() {
            const password = document.getElementById('passwordInput').value;
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                    showDashboard();
                } else {
                    errEl.textContent = data.error || 'Incorrect password';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = 'Connection error';
                errEl.style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            startAutoRefresh();
        }

        function logout() {
            localStorage.removeItem(TOKEN_KEY);
            clearInterval(refreshInterval);
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        async function refresh() {
            try {
                const [statusRes, tradesRes, deltaRes] = await Promise.all([
                    apiFetch('/api/status').catch(() => null),
                    apiFetch('/api/trades').catch(() => []),
                    apiFetch('/api/delta').catch(() => null),
                ]);
                if (statusRes) renderStatus(statusRes);
                if (tradesRes) renderTrades(tradesRes);
                if (deltaRes) renderDelta(deltaRes);
            } catch (e) { /* handled in apiFetch */ }
        }

        function renderStatus(s) {
            const el = document.getElementById('status');
            el.textContent = s.status;
            el.className = 'card-value ' + (s.status === 'IN_TRADE' ? 'text-blue' : 'text-green');
            document.getElementById('statusSub').textContent = s.timestamp ? new Date(s.timestamp).toLocaleTimeString() : '';
            document.getElementById('todayTrades').textContent = `${s.todayTrades || 0} / 10`;
            document.getElementById('todayLosses').textContent = `${s.todayLosses || 0} losses today`;
            document.getElementById('winRate').textContent = (s.stats?.winRate || 0) + '%';
            document.getElementById('totalTrades').textContent = `${s.stats?.totalTrades || 0} total`;
            const pnl = s.stats?.totalPnL || 0;
            const pnlEl = document.getElementById('totalPnl');
            pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '%';
            pnlEl.className = 'card-value ' + (pnl >= 0 ? 'text-green' : 'text-red');
            document.getElementById('mockBalance').textContent = 'Mock Balance: ₹' + (s.stats?.balance || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
            const panel = document.getElementById('activePanel');
            if (s.activeTrade) {
                panel.style.display = 'block';
                document.getElementById('activeDirection').textContent = s.activeTrade.decision;
                document.getElementById('activeDirection').className = 'badge ' + (s.activeTrade.decision === 'BUY' ? 'badge-green' : 'badge-red');
                document.getElementById('activeDetails').innerHTML = `
      <div class="ind-item"><div class="ind-label">Entry</div>${s.activeTrade.price}</div>
      <div class="ind-item"><div class="ind-label">Stop Loss</div>${s.activeTrade.stop_loss}</div>
      <div class="ind-item"><div class="ind-label">Take Profit</div>${s.activeTrade.take_profit}</div>
      <div class="ind-item"><div class="ind-label">Quantity</div>${s.activeTrade.quantity}</div>
      <div class="ind-item"><div class="ind-label">Leverage</div>${s.activeTrade.leverage}x</div>
      <div class="ind-item"><div class="ind-label">Order ID</div><span class="text-dim">${(s.activeTrade.order_id || '').slice(0, 16)}</span></div>`;
            } else { panel.style.display = 'none'; }
        }

        function renderTrades(trades) {
            document.getElementById('tradeCount').textContent = trades.length + ' trades';
            const body = document.getElementById('tradeBody');
            if (!trades.length) { body.innerHTML = '<tr><td colspan="10" class="text-dim" style="text-align:center;padding:24px;">No trades yet</td></tr>'; return; }
            body.innerHTML = trades.map(t => {
                const time = new Date(t.timestamp).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                const sideClass = t.decision === 'BUY' ? 'text-green' : 'text-red';
                const pnl = t.pnl != null ? (t.pnl >= 0 ? '+' : '') + parseFloat(t.pnl).toFixed(2) + '%' : '—';
                const pnlClass = t.pnl > 0 ? 'text-green' : t.pnl < 0 ? 'text-red' : 'text-dim';
                const statusBadge = t.status === 'OPEN' ? 'badge-blue' : t.pnl > 0 ? 'badge-green' : t.pnl < 0 ? 'badge-red' : 'badge-amber';
                const pnlInr = t.pnl_inr != null ? (t.pnl_inr >= 0 ? '+' : '') + parseFloat(t.pnl_inr).toFixed(2) : null;
                const pnlDisplay = pnlInr ? `${pnl} (₹${pnlInr})` : pnl;
                const fullReason = t.reason || '—';
                const isLongReason = fullReason.length > 45;
                const reasonHtml = isLongReason
                    ? `<div class="reason-cell" onclick="toggleReason(this)">
                        <div class="reason-content collapsed">${fullReason}</div>
                        <span class="reason-more">Read More</span>
                       </div>`
                    : `<div class="reason-cell"><div class="reason-content">${fullReason}</div></div>`;

                return `<tr><td>${time}</td><td class="${sideClass}">${t.decision}</td><td>${parseFloat(t.price || 0).toFixed(5)}</td><td>${parseFloat(t.stop_loss || 0).toFixed(5)}</td><td>${parseFloat(t.take_profit || 0).toFixed(5)}</td><td>${t.quantity}</td><td>${t.raw_response ? (JSON.parse(t.raw_response).score || '—') : '—'}</td><td><span class="badge ${statusBadge}">${t.status}</span></td><td class="${pnlClass}">${pnlDisplay}</td><td>${reasonHtml}</td></tr>`;
            }).join('');
        }

        function toggleReason(el) {
            const content = el.querySelector('.reason-content');
            const more = el.querySelector('.reason-more');
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                more.textContent = 'Show Less';
            } else {
                content.classList.add('collapsed');
                content.classList.remove('expanded');
                more.textContent = 'Read More';
            }
        }

        function renderDelta(d) {
            const el = document.getElementById('deltaStatus');
            if (d.error) { el.textContent = 'NOT BOUND'; el.className = 'badge badge-red'; return; }
            el.textContent = d.connected ? 'CONNECTED' : 'DISCONNECTED';
            el.className = 'badge ' + (d.connected ? 'badge-green' : 'badge-red');
            document.getElementById('deltaUptime').textContent = (d.uptimeMin || d.uptimeMin === 0) ? d.uptimeMin + ' min' : '—';
            document.getElementById('deltaMsgs').textContent = d.messageCount != null ? d.messageCount.toLocaleString() : '—';
            const fmtCvd = (data) => {
                if (!data) return '—';
                const cls = data.direction === 'rising' ? 'text-green' : data.direction === 'falling' ? 'text-red' : 'text-dim';
                return `<span class="${cls}">${data.direction}</span> · ${data.slope} · ${data.minutesOfData || 0}min`;
            };
            document.getElementById('btcCvd').innerHTML = fmtCvd(d.btc);
            document.getElementById('dogeCvd').innerHTML = fmtCvd(d.doge);
        }

        async function triggerRun() {
            const pre = document.getElementById('lastRun');
            pre.textContent = 'Running strategy...';
            try {
                const data = await apiFetch('/api/run');
                pre.textContent = JSON.stringify(data, null, 2);
                setTimeout(refresh, 500);
            } catch (e) { pre.textContent = 'Error: ' + e.message; }
        }

        function startAutoRefresh() {
            refresh();
            let countdown = 10;
            const timerEl = document.getElementById('timer');
            clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                countdown--;
                timerEl.textContent = `Auto-refresh: ${countdown}s`;
                if (countdown <= 0) { refresh(); countdown = 10; }
            }, 1000);
        }
    </script>
</body>

</html>
